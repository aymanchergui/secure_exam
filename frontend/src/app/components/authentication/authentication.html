<section class="authentication-page">
  <div class="authentication-card">
    <div class="authentication-icon">
      <i data-lucide="shield-check"></i>
    </div>

    <h1>ISEN SecureExam</h1>
    <p>Authentification enseignant sécurisée</p>

    <label>
      Identifiant
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="prof"
        autocomplete="username"
      >
    </label>

    <label>
      Mot de passe
      <input
        type="password"
        [(ngModel)]="password"
        (keyup.enter)="submitAuthentication()"
        placeholder="Mot de passe"
        autocomplete="current-password"
      >
    </label>

    <button type="button" (click)="submitAuthentication()">
      <i data-lucide="log-in" class="btn-icon"></i>
      S'authentifier
    </button>

    <div *ngIf="authenticationError" class="authentication-error">
      <i data-lucide="circle-alert" class="message-icon"></i>
      {{ authenticationError }}
    </div>

    <div class="authentication-support">
      <span>Problème de connexion ?</span>

      <a
        href=""
        class="support-link"
        (click)="openSupport(); $event.preventDefault()"
      >
        <i data-lucide="life-buoy"></i>
        Consulter le support
      </a>
    </div>
  </div>
</section>
