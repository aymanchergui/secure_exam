<section class="support-page">
  <app-header-auth class="support-auth-header"></app-header-auth>

  <div class="support-main-layout">
    <div class="support-return-row">
    <button
      type="button"
      class="support-back-button"
      (click)="goBackToAuthentication()"
    >
      <i data-lucide="arrow-left"></i>
      <span>Retour à l'authentification</span>
    </button>
  </div>

  <div class="support-content">
    <div class="support-card">
      <div class="support-header">
        <div class="support-icon">
          <i data-lucide="life-buoy"></i>
        </div>

        <div>
          <h1>Support</h1>
          <p>
            Décrivez votre problème d'accès à la plateforme. L'équipe support pourra
            traiter votre demande plus rapidement.
          </p>
        </div>
      </div>

      <form class="support-form" (ngSubmit)="submitSupportRequest()">
        <div class="form-grid">
          <label>
            Nom complet
            <div class="input-wrapper">
              <i data-lucide="user-round"></i>
              <input
                type="text"
                name="fullName"
                [(ngModel)]="supportRequest.fullName"
                placeholder="Votre nom"
              >
            </div>
          </label>

          <label>
            Email
            <div class="input-wrapper">
              <i data-lucide="mail"></i>
              <input
                type="email"
                name="email"
                [(ngModel)]="supportRequest.email"
                placeholder="prenom.nom@isen.fr"
              >
            </div>
          </label>
        </div>

        <label>
          Type de problème
          <div class="input-wrapper">
            <i data-lucide="circle-help"></i>
            <select
              name="subject"
              [(ngModel)]="supportRequest.subject"
            >
              <option>Problème de connexion</option>
              <option>Mot de passe oublié</option>
              <option>Compte enseignant bloqué</option>
              <option>Serveur indisponible</option>
              <option>Autre problème</option>
            </select>
          </div>
        </label>

        <label>
          Message
          <div class="textarea-wrapper">
            <i data-lucide="message-square-text"></i>
            <textarea
              name="message"
              [(ngModel)]="supportRequest.message"
              rows="6"
              placeholder="Expliquez le problème rencontré..."
            ></textarea>
          </div>
        </label>

        <button
          type="submit"
          class="support-submit-button"
          [disabled]="loading"
        >
          <i [attr.data-lucide]="loading ? 'loader-circle' : 'send'"></i>
          {{ loading ? 'Envoi en cours...' : 'Envoyer la demande' }}
        </button>

        <div *ngIf="errorMessage" class="support-error">
          <i data-lucide="circle-alert"></i>
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="support-success">
          <i data-lucide="circle-check"></i>
          {{ successMessage }}
        </div>
      </form>

      <div class="support-note">
        <i data-lucide="shield-check"></i>
        <span>
          Cette demande concerne uniquement l'accès enseignant à ISEN SecureExam.
        </span>
      </div>
    </div>
  </div>
  </div>
</section>
