<section class="admin-auth-page">
  <app-public-header class="admin-auth-header"></app-public-header>

  <main class="admin-auth-main">
    <section class="admin-auth-top">
      <button class="admin-auth-back-button" type="button" (click)="goBack()">
        <span>←</span>
        Retour à l'accueil
      </button>

      <section class="admin-auth-title">
        <h1>Espace Admin</h1>
        <p>
          Connectez-vous pour consulter les examens préparés et récupérer les
          configurations NixOS générées.
        </p>
      </section>

      <div class="admin-auth-spacer"></div>
    </section>

    <section class="admin-auth-card">
      <div class="admin-auth-heading">
        <div class="admin-auth-icon">
          <i data-lucide="shield-check"></i>
        </div>

        <div>
          <h2>Authentification</h2>
          <p>ISEN SecureExam</p>
        </div>
      </div>

      <label>
        Identifiant
        <input
          type="text"
          [(ngModel)]="username"
          placeholder="administrateur"
          autocomplete="username"
        >
      </label>

      <label>
        Mot de passe
        <input
          type="password"
          [(ngModel)]="password"
          (keyup.enter)="submitAuthentication()"
          placeholder="Mot de passe"
          autocomplete="current-password"
        >
      </label>

      <button
        class="admin-auth-submit"
        type="button"
        [disabled]="isLoading"
        (click)="submitAuthentication()"
      >
        <i data-lucide="log-in"></i>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <div *ngIf="authenticationError" class="admin-auth-error">
        <i data-lucide="circle-alert"></i>
        {{ authenticationError }}
      </div>

      <div class="admin-auth-support">
        <span>Problème sur la plateforme ?</span>

        <button class="admin-support-link" type="button" (click)="openSupport()">
          <i data-lucide="life-buoy"></i>
          Consulter le support
        </button>
      </div>
    </section>
  </main>
</section>
