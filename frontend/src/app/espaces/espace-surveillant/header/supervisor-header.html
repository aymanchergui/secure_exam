<header class="supervisor-header">
  <div class="supervisor-header-left">
    <img
      src="/assets/secure_exam_logo.png"
      alt="ISEN SecureExam"
      class="supervisor-header-logo"
      title="Retour au tableau de bord surveillant"
      (click)="goToSupervisorDashboard()"
    >
  </div>

  <nav class="supervisor-header-nav">
    <a
      href="#dashboard"
      [class.active]="activeSection === 'dashboard'"
      (click)="goToSection('dashboard', $event)"
    >
      <i data-lucide="layout-dashboard" class="supervisor-nav-icon"></i>
      Dashboard
    </a>

    <a
      href="#configs"
      [class.active]="activeSection === 'configs'"
      (click)="goToSection('configs', $event)"
    >
      <i data-lucide="download-cloud" class="supervisor-nav-icon"></i>
      Configurations
    </a>

    <a
      href="#machines"
      [class.active]="activeSection === 'machines'"
      (click)="goToSection('machines', $event)"
    >
      <i data-lucide="monitor-check" class="supervisor-nav-icon"></i>
      Machines
    </a>

    <a
      href="#help"
      [class.active]="activeSection === 'help'"
      (click)="goToSection('help', $event)"
    >
      <i data-lucide="life-buoy" class="supervisor-nav-icon"></i>
      Assistance
    </a>
  </nav>

  <div class="supervisor-header-actions">
    <button
      class="supervisor-refresh-button"
      type="button"
      (click)="refresh()"
      title="Actualiser"
      aria-label="Actualiser"
    >
      <i data-lucide="refresh-cw"></i>
    </button>

    <button
      class="supervisor-profile-button"
      type="button"
      title="Profil surveillant"
      [class.active]="activeSection === 'profile'"
      (click)="goToSection('profile')"
    >
      <span class="supervisor-profile-avatar">
        <i data-lucide="shield-user"></i>
      </span>

      <span class="supervisor-profile-info">
        <span class="supervisor-profile-name">{{ supervisorName }}</span>
        <span class="supervisor-profile-role">Surveillant</span>
      </span>
    </button>

    <button
      class="supervisor-logout-button"
      type="button"
      (click)="logout()"
      title="Se déconnecter"
      aria-label="Se déconnecter"
    >
      <i data-lucide="log-out"></i>
    </button>
  </div>
</header>
