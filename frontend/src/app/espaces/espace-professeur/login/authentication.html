<section class="authentication-page">
  <app-public-header class="authentication-public-header"></app-public-header>

  <section class="professor-login-top-grid">
    <div class="professor-login-left">
      <button class="professor-login-home-button" type="button" (click)="goToMainDashboard()">
        <span>←</span>
        Retour à l'accueil
      </button>
    </div>

    <section class="professor-login-title">
      <h1>Espace Professeur</h1>
      <p>
        Connectez-vous pour préparer les examens, générer les configurations<br>
        et suivre les environnements SecureExam.
      </p>

    </section>

    <div class="professor-login-right"></div>
  </section>

  <div class="authentication-card">
    <div class="authentication-heading">
      <div class="authentication-icon">
        <i data-lucide="shield-check"></i>
      </div>

      <div class="authentication-title-block">
        <h1>Authentication</h1>
        <p>ISEN SecureExam</p>
      </div>
    </div>

    <label>
      Identifiant
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="prof"
        autocomplete="username"
      >
    </label>

    <label>
      Mot de passe
      <input
        type="password"
        [(ngModel)]="password"
        (keyup.enter)="submitAuthentication()"
        placeholder="Mot de passe"
        autocomplete="current-password"
      >
    </label>

    <button type="button" class="authentication-submit-button" (click)="submitAuthentication()">
      <i data-lucide="log-in" class="btn-icon"></i>
      S'authentifier
    </button>

    <div *ngIf="authenticationError" class="authentication-error">
      <i data-lucide="circle-alert" class="message-icon"></i>
      {{ authenticationError }}
    </div>

    <div class="authentication-support">
      <span>Problème sur la plateforme ?</span>

      <a
        href=""
        class="support-link"
        (click)="openSupport(); $event.preventDefault()"
      >
        <i data-lucide="life-buoy"></i>
        Consulter le support
      </a>
    </div>
  </div>
</section>
